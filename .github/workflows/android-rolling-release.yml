name: Native Android APK Rolling Release (Overwrite Latest)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

concurrency:
  group: android-native-rolling-release
  cancel-in-progress: true

jobs:
  build-and-overwrite-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept pre-installed Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure optional release keystore (if secrets are provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "RELEASE_STORE_FILE=$(pwd)/app/release.keystore" >> $GITHUB_ENV
          fi

      - name: Run JUnit 4 tests & build Native Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Stage deterministic rolling APK filename
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in app/build/outputs/apk/release"
            exit 1
          fi
          cp "$APK_PATH" dist/edgeledger-android-latest.apk
          sha256sum dist/edgeledger-android-latest.apk > dist/edgeledger-android-latest.apk.sha256
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat <<EOF > dist/release-notes.md
          ### EdgeLedger Native Kotlin v4.0 — Rolling Latest Build
          - **Built:** ${BUILD_DATE}
          - **Commit:** \`${GITHUB_SHA::8}\`
          - **Stack:** Native Kotlin 2.1 + Jetpack Compose (Material 3) + Room + DataStore + WorkManager + Glance Widget
          - **Sports:** Football, NFL, NBA, NHL, MLB, ATP Tennis, Cricket, Formula 1, MMA — 100% free keyless on-device weekly sync.
          EOF

      - name: Force-move rolling 'latest' tag to current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Overwrite existing 'latest' GitHub Release and APK asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "EdgeLedger Android (Rolling Latest)"
          make_latest: "true"
          body_path: dist/release-notes.md
          files: |
            dist/edgeledger-android-latest.apk
            dist/edgeledger-android-latest.apk.sha256
