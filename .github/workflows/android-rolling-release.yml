name: Native Android APK Release (Versioned + Latest)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: android-native-release
  cancel-in-progress: false

jobs:
  build-and-publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept pre-installed Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure release keystore in runner temp
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            set -euo pipefail
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            chmod 600 "${RUNNER_TEMP}/release.keystore"
            echo "RELEASE_STORE_FILE=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Using ephemeral debug keystore (in-place APK updates require setting ANDROID_KEYSTORE_BASE64/PASSWORD/ALIAS/KEY_PASSWORD secrets)."
          fi

      - name: Run JUnit 4 tests, Lint & build Native Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintRelease assembleRelease --no-daemon

      - name: Stage versioned APK and checksum
        run: |
          mkdir -p dist
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Signed app-release.apk not found in app/build/outputs/apk/release"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          fi
          cp "$APK_PATH" "dist/edgeledger-android-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "dist/edgeledger-android-latest.apk"
          (cd dist && sha256sum "edgeledger-android-v${VERSION_NAME}.apk" > "edgeledger-android-v${VERSION_NAME}.apk.sha256")
          (cd dist && sha256sum "edgeledger-android-latest.apk" > "edgeledger-android-latest.apk.sha256")
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat <<EOF > dist/release-notes.md
          ### EdgeLedger Native Kotlin v${VERSION_NAME}
          - **Built:** ${BUILD_DATE}
          - **Commit:** \`${GITHUB_SHA::8}\`
          - **Stack:** Native Kotlin 2.1 + Jetpack Compose (Material 3) + Room 2.7 + Keystore AES-256-GCM + DataStore + WorkManager + Glance Widget
          - **Highlights:** 100% live-dataset-only pipeline, real Room odds-history line movement, log-space Poisson math, R8 minification, and hardened offline caching.
          EOF

      - name: Create immutable versioned release tag (if new)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag "$TAG"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish immutable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "EdgeLedger Android v${{ env.APP_VERSION }} (Build ${{ github.run_number }})"
          make_latest: "true"
          body_path: dist/release-notes.md
          files: |
            dist/edgeledger-android-v${{ env.APP_VERSION }}.apk
            dist/edgeledger-android-v${{ env.APP_VERSION }}.apk.sha256
            dist/edgeledger-android-latest.apk
            dist/edgeledger-android-latest.apk.sha256

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"
